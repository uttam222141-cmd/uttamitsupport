<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers | Uttam IT Support ERP</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="css/erp.css">
</head>
<body class="erp-body">

<div class="erp-shell">
  <aside class="erp-sidebar">
    <div class="brand">
      <span class="brand-name">UTTAM IT SUPPORT</span>
      <span class="brand-sub">ERP System</span>
    </div>
    <nav class="erp-nav">
      <a href="index.html">Dashboard</a>
      <a href="customers.html" class="active">Customers</a>
      <a href="inventory.html">Inventory</a>
      <a href="quotations.html">Quotations</a>
      <a href="invoices.html">Invoices</a>
      <a href="job-cards.html">Repair Job Cards</a>
      <a href="delivery-challans.html">Delivery Challans</a>
      <a href="amc-agreements.html">AMC Agreements</a>
      <a href="receipts.html">Customer Receipts</a>
      <a href="#" class="nav-soon">Reports <small>(coming soon)</small></a>
      <a href="#" class="nav-soon" data-role="admin">Settings <small>(coming soon)</small></a>
    </nav>
    <div class="erp-sidebar-footer">
      <span id="erp-user-name">—</span>
      <span id="erp-user-role" class="erp-badge role-viewer">—</span>
      <button onclick="erpLogout()">Sign out</button>
    </div>
  </aside>

  <main class="erp-main">
    <div class="erp-topbar">
      <h1>Customers</h1>
      <button class="btn btn-solid" id="open-add-customer" data-role="admin,technician">+ New Customer</button>
    </div>
    <div class="erp-content">

      <div class="erp-card">
        <div class="erp-section-head">
          <h2>All Customers</h2>
          <input type="search" class="erp-search" id="customer-search" placeholder="Search name, phone, city…">
        </div>
        <div class="erp-table-wrap">
          <table class="erp-table">
            <thead>
              <tr>
                <th>Name</th><th>Company</th><th>Phone</th><th>Email</th><th>City</th><th>Added</th><th data-role="admin,technician">Actions</th>
              </tr>
            </thead>
            <tbody id="customers-body">
              <tr class="erp-empty-row"><td colspan="7">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Add / Edit modal -->
<div class="erp-modal-overlay" id="customer-modal">
  <div class="erp-modal">
    <button class="erp-modal-close" id="close-customer-modal">&times;</button>
    <h3 id="customer-modal-title">New Customer</h3>
    <form id="customer-form">
      <input type="hidden" id="customer-id">
      <div class="erp-form-grid">
        <div class="erp-field">
          <label>Customer Name *</label>
          <input type="text" id="c-name" required>
        </div>
        <div class="erp-field">
          <label>Company Name</label>
          <input type="text" id="c-company">
        </div>
        <div class="erp-field">
          <label>Phone *</label>
          <input type="tel" id="c-phone" required>
        </div>
        <div class="erp-field">
          <label>Email</label>
          <input type="email" id="c-email">
        </div>
        <div class="erp-field">
          <label>GST Number</label>
          <input type="text" id="c-gst">
        </div>
        <div class="erp-field">
          <label>City</label>
          <input type="text" id="c-city">
        </div>
        <div class="erp-field">
          <label>State</label>
          <input type="text" id="c-state">
        </div>
      </div>
      <div class="erp-field">
        <label>Address</label>
        <textarea id="c-address" rows="2"></textarea>
      </div>
      <div class="erp-field">
        <label>Notes</label>
        <textarea id="c-notes" rows="2"></textarea>
      </div>
      <p class="erp-error" id="customer-form-error"></p>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-solid">Save Customer</button>
        <button type="button" class="btn btn-ghost" id="cancel-customer-form">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
