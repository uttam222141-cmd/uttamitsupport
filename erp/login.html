<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Uttam IT Support ERP</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="css/erp.css">
</head>
<body class="erp-body">

<div class="erp-login-wrap">
  <div class="erp-login-card">
    <h1>Uttam IT Support</h1>
    <p class="sub">Staff / ERP sign in</p>

    <form id="login-form">
      <div class="erp-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="erp-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-solid btn-lg" style="width:100%;">Sign In</button>
      <p class="erp-error" id="login-error"></p>
    </form>

    <p style="margin-top:18px; font-size:.82rem;"><a href="../index.html" style="color:var(--blue); font-weight:600;">&larr; Back to website</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
  // If already signed in, skip straight to the dashboard.
  window.supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'index.html';
  });

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = error.message === 'Invalid login credentials'
        ? 'Incorrect email or password.'
        : error.message;
      return;
    }
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
